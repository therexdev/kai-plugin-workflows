name: Validate and publish Foundation plugin
on:
  push:
    branches: [main, foundation-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    outputs:
      release_ready: ${{ steps.package.outputs.release_ready }}
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild locked dependencies without install hooks
        shell: bash
        run: |
          if test -f package-lock.json; then npm ci --ignore-scripts; fi
          npm run build --if-present
          git diff --exit-code -- plugin
      - name: Verify Foundation source and dependency payloads
        run: node scripts/verify-package.js --source
      - run: npm test
      - name: Assemble immutable signed asset parts
        run: node scripts/assemble-signed-package.js
      - name: Detect signed package for this exact version
        id: package
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),p=require("./package.json"),m=require("./plugin/manifest.json"),asset=p.name+"-"+m.version+".kaiplugin";fs.appendFileSync(process.env.GITHUB_OUTPUT,"asset="+asset+"\nrelease_ready="+fs.existsSync("dist/"+asset)+"\n")'
      - name: Verify release signature and exact source contents
        if: steps.package.outputs.release_ready == 'true'
        run: node scripts/verify-package.js
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: kai-plugin-workflows
      - uses: actions/checkout@v4
        with:
          repository: therexdev/kai-core
          ref: 217f80069a97482aad7acd3dea2a611e160df1bb
          path: kai-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned test dependencies
        run: |
          npm ci --ignore-scripts --prefix kai-core
          node kai-core/node_modules/electron/install.js
          sudo chown root:root kai-core/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 kai-core/node_modules/electron/dist/chrome-sandbox
      - name: Exercise Workflows through real Core with a synthetic profile
        env:
          KAI_FOUNDATION_SMOKE_IDS: kai.workflows
          KAI_FOUNDATION_APPS_OUTPUT: ${{ runner.temp }}/workflows-native-results
        run: xvfb-run -a node kai-plugin-workflows/scripts/native-smoke.js --synthetic-keychain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflows-native-results
          path: ${{ runner.temp }}/workflows-native-results
          if-no-files-found: warn
  release:
    needs: [verify, native]
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assemble immutable signed asset parts
        run: node scripts/assemble-signed-package.js
      - name: Verify signed immutable asset again before publication
        run: node scripts/verify-package.js
      - name: Publish only the pre-signed current package
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.verify.outputs.asset }}
        shell: bash
        run: |
          version=$(node -p "require('./plugin/manifest.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$tag" --pattern "$ASSET" --dir "$RUNNER_TEMP/existing-release"
            cmp "dist/$ASSET" "$RUNNER_TEMP/existing-release/$ASSET"
          else
            gh release create "$tag" "dist/$ASSET" --target "$GITHUB_SHA" --title "$(node -p "require('./plugin/manifest.json').name") $version" --notes-file RELEASE_NOTES.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: signed-plugin
          path: dist/${{ needs.verify.outputs.asset }}
          if-no-files-found: error
